name: Python tests

on:
  push:
  pull_request:

env:
  PYTHONPATH: robot/ros2_ws/src/robot_core:robot/ros2_ws/src/robot_locations:robot/ros2_ws/src/robot_navigation:robot/ros2_ws/src/robot_safety:robot/ros2_ws/src/robot_voice

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: pip install ruff
      - name: Lint
        run: .claude/skills/run-checks/check.sh lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pyyaml
      - name: Run unit tests
        run: .claude/skills/run-checks/check.sh tests -v
      - name: Compile Python packages
        run: .claude/skills/run-checks/check.sh compile

  ros-build:
    runs-on: ubuntu-latest
    steps:
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >-
            robot_bringup
            robot_core
            robot_description
            robot_locations
            robot_navigation
            robot_safety
            robot_voice
          target-ros2-distro: jazzy
          import-token: ${{ secrets.GITHUB_TOKEN }}
