name: Python tests

on:
  push:
  pull_request:

env:
  PYTHONPATH: robot/ros2_ws/src/robot_core:robot/ros2_ws/src/robot_locations:robot/ros2_ws/src/robot_navigation:robot/ros2_ws/src/robot_safety:robot/ros2_ws/src/robot_voice

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint dependencies
        run: pip install ruff
      - name: Lint
        run: .claude/skills/run-checks/check.sh lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pyyaml
      - name: Run unit tests
        run: .claude/skills/run-checks/check.sh tests -v
      - name: Compile Python packages
        run: .claude/skills/run-checks/check.sh compile

  ros-build:
    runs-on: ubuntu-latest
    # Plain colcon rather than action-ros-ci, which always builds with
    # --symlink-install; in CI that left sibling packages (robot_core,
    # robot_safety) unimportable from each other's tests.
    env:
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Build and test
        working-directory: robot/ros2_ws
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
          colcon build
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
