# Parameters for the robot_safety command gate.
#
# stop_distance and caution_distance are DERIVED, not chosen. They come from
# base_dynamics.yaml via robot_safety.distances.derive_safety_distances, and
# BringupSafetyDistanceTests fails if they drift apart. To change them, change
# base_dynamics.yaml and update the two values below to match.
#
# They are still placeholders, because base_dynamics.yaml is still assumptions
# (measured: false) matched to the placeholder URDF. Re-derive them from the
# measured base and re-run docs/safety-test-procedure.md before any hardware
# test.
safety_controller:
  ros__parameters:
    use_sim_time: true

    # Zero speed at or inside this distance.
    # = sensor_to_front_edge + safety_factor * (reaction + braking)
    # = 0.05 + 1.5 * (0.125 + 0.125), rounded up to 0.05 m.
    stop_distance: 0.45

    # 35% speed between stop_distance and this distance. Deep enough to shed
    # the difference between max_speed and caution speed before reaching
    # stop_distance.
    caution_distance: 0.85

    # A scan older than this is treated as no scan at all.
    sensor_timeout: 0.5
    # A motion request older than this is discarded rather than held.
    command_timeout: 0.5

    # Must match control_period in base_dynamics.yaml.
    control_rate_hz: 20.0

    # Localization and battery are stop conditions, but only once the robot
    # actually has them. This file drives the teleop simulation, which has
    # neither: a gate demanding a pose from a robot nobody is localizing
    # would simply refuse to move, and the operator would learn to ignore it.
    #
    # navigation.launch.py loads safety_navigation.yaml instead, which turns
    # the localization check on because Nav2 is then the thing driving.
    require_localization: false
    localization_timeout: 1.0
    # Negative means the check is off. ROS parameters have no null, and 0.0
    # is a real (unsatisfiable) value.
    max_localization_covariance: -1.0
    low_battery_fraction: -1.0
